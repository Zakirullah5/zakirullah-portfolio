      (function() {
        try {
          const win = window;
          const origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if ((obj === win || obj === globalThis || (typeof Window !== 'undefined' && obj === Window.prototype)) && prop === 'fetch') {
              if (descriptor && descriptor.get && !descriptor.set) {
                let assignedFetch = null;
                const originalGet = descriptor.get;
                descriptor.set = function(newVal) {
                  assignedFetch = newVal;
                };
                descriptor.get = function() {
                  return assignedFetch || originalGet.call(this);
                };
                descriptor.configurable = true;
              }
            }
            return origDefineProperty.call(this, obj, prop, descriptor);
          };

          const origDefineProperties = Object.defineProperties;
          Object.defineProperties = function(obj, props) {
            if ((obj === win || obj === globalThis || (typeof Window !== 'undefined' && obj === Window.prototype)) && props && props.fetch) {
              const descriptor = props.fetch;
              if (descriptor && descriptor.get && !descriptor.set) {
                let assignedFetch = null;
                const originalGet = descriptor.get;
                descriptor.set = function(newVal) {
                  assignedFetch = newVal;
                };
                descriptor.get = function() {
                  return assignedFetch || originalGet.call(this);
                };
                descriptor.configurable = true;
              }
            }
            return origDefineProperties.call(this, obj, props);
          };
        } catch (e) {
          // Safe fallback
        }
      })();
    </script>
