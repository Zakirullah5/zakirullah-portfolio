services:
  - type: web
    name: zakirullah-portfolio-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/content
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_DEFAULT_EMAIL
        value: zakir1kb@gmail.com
      - key: ADMIN_DEFAULT_PASSWORD
        value: khan@123
